name: Build binaries

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: milky2onebot-linux-x86_64
            executable: milky2onebot
            package: dist/milky2onebot-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: milky2onebot-windows-x86_64
            executable: milky2onebot.exe
            package: dist/milky2onebot-windows-x86_64.zip
          - os: macos-15-intel
            artifact: milky2onebot-macos-x86_64
            executable: milky2onebot
            package: dist/milky2onebot-macos-x86_64.tar.gz
          - os: macos-15
            artifact: milky2onebot-macos-arm64
            executable: milky2onebot
            package: dist/milky2onebot-macos-arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Build executable
        run: >-
          uv run --locked --with pyinstaller==6.16.0
          --with setuptools==80.9.0
          --with pillow==11.3.0
          pyinstaller --noconfirm --clean --onefile
          --name milky2onebot --icon logo.jpg main.py

      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          tar -czf "${{ matrix.package }}"
          -C dist "${{ matrix.executable }}"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "dist/${{ matrix.executable }}"
          -DestinationPath "${{ matrix.package }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14
